[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "harnesskit"
version = "0.1.0"
description = "A lightweight, model-agnostic LLM agent harness: ReAct loop, tool registry, pluggable providers, session memory and policy guards."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "jiang-2007" }]
keywords = ["agent", "llm", "agent-framework", "tool-calling", "rag", "multi-agent"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries",
]

[tool.setuptools.packages.find]
where = ["src"]
